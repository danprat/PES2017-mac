name: Build macOS App

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# The tag-triggered build publishes its zip straight to a GitHub Release, so
# building the tag is also creating it.
permissions:
  contents: write

jobs:
  build:
    name: Build macOS (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-14 is deprecated and macos-13's Intel image is retired --
          # jobs pointed at it queued for an hour and never started. macos-15
          # is the current arm64 image. The Intel sibling (macos-15-large) is
          # a larger runner the account's spending limit has to answer for,
          # so the CI carries only the chip that actually starts;
          # build-macos.sh still builds x86_64 natively on a Mac Intel.
          - os: macos-15
            arch: arm64
            name: AppleSilicon

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies via Homebrew
        run: |
          brew update --quiet || true
          brew install cmake ninja molten-vk sdl3 vulkan-headers vulkan-loader

      - name: Build PES 2017 and Package Application Bundle
        run: |
          chmod +x build-macos.sh tools/package_macos.sh Run-PES2017.command
          ./build-macos.sh --package

      - name: Create Zip Archive
        run: |
          zip -r -y "PES-2017-macOS-${{ matrix.name }}.zip" "PES 2017.app"

      - name: Upload PES 2017.app Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PES-2017-macOS-${{ matrix.name }}
          path: PES-2017-macOS-${{ matrix.name }}.zip
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "PES 2017 for macOS ${{ github.ref_name }}" \
            --notes "Standalone PES 2017.app (${{ matrix.arch }}). Double-click PES2017 in the app to run it; see docs/MACOS.md for the full setup." \
            "PES-2017-macOS-${{ matrix.name }}.zip"
